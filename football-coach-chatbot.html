<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CoachAI – Football Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  /* ============ THEME (matches the CoachAI site) ============ */
  :root {
    --brand: #1fae52;
    --brand-dark: #178a41;
    --brand-soft: #eaf7ef;
    --lime: #7ed321;
    --bg: #f6f8f7;
    --card: #ffffff;
    --surface: #fafcfb;
    --text: #0f1f17;
    --muted: #5f7068;
    --border: #e2ebe5;
    --radius-lg: 28px;
    --radius: 18px;
    --shadow: 0 1px 2px rgba(15, 31, 23, 0.04), 0 20px 50px -20px rgba(31, 174, 82, 0.25);
    --heading: "Plus Jakarta Sans", "Inter", system-ui, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }

  .fc-section {
    position: relative;
    max-width: 960px;
    margin: 0 auto;
    padding: 56px 16px;
  }
  .fc-section::before { /* soft green glow like the site hero */
    content: "";
    position: absolute; inset: 0;
    background:
      radial-gradient(600px 300px at 50% 10%, rgba(31, 174, 82, 0.12), transparent 70%),
      radial-gradient(400px 300px at 90% 80%, rgba(126, 211, 33, 0.10), transparent 70%);
    pointer-events: none;
    z-index: 0;
  }
  .fc-section > * { position: relative; z-index: 1; }

  /* ============ SECTION HEADING ============ */
  .fc-intro { text-align: center; margin-bottom: 32px; }
  .fc-eyebrow {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 16px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 999px;
    font-size: 0.85rem; font-weight: 600; color: var(--muted);
    box-shadow: 0 4px 14px rgba(15, 31, 23, 0.05);
  }
  .fc-intro h2 {
    font-family: var(--heading);
    font-weight: 800;
    font-size: clamp(2rem, 5vw, 3.2rem);
    letter-spacing: -0.035em;
    line-height: 1.05;
    margin: 18px 0 12px;
  }
  .fc-gradient {
    background: linear-gradient(90deg, var(--brand), var(--lime));
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
  }
  .fc-intro p { margin: 0 auto; max-width: 560px; color: var(--muted); font-size: 1.05rem; line-height: 1.6; }

  /* ============ MAIN CARD ============ */
  .fc-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .fc-topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .fc-coach { display: flex; align-items: center; gap: 12px; }
  .fc-logo {
    width: 44px; height: 44px; border-radius: 14px;
    background: linear-gradient(135deg, var(--brand), #27c35f);
    display: grid; place-items: center; font-size: 1.3rem;
    box-shadow: 0 6px 16px rgba(31, 174, 82, 0.35);
    flex-shrink: 0;
  }
  .fc-coach-name { font-family: var(--heading); font-weight: 800; font-size: 1.05rem; letter-spacing: -0.02em; }
  .fc-status { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; color: var(--muted); }
  .fc-status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.2); }

  /* segmented tabs */
  .fc-tabs { display: flex; gap: 4px; padding: 4px; background: #f0f4f1; border-radius: 999px; }
  .fc-tab {
    border: none; background: transparent; cursor: pointer;
    font: 600 0.9rem "Inter", sans-serif; color: var(--muted);
    padding: 10px 18px; border-radius: 999px;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .fc-tab:hover { color: var(--text); }
  .fc-tab.active { background: var(--card); color: var(--brand-dark); box-shadow: 0 2px 8px rgba(15, 31, 23, 0.08); }

  /* ============ PANELS ============ */
  .fc-panel { display: none; flex-direction: column; }
  .fc-panel.active { display: flex; }

  .fc-progress { padding: 14px 20px 0; }
  .fc-progress-row { display: flex; justify-content: space-between; font-size: 0.8rem; font-weight: 600; color: var(--muted); margin-bottom: 8px; }
  .fc-progress-track { height: 6px; background: #edf2ee; border-radius: 999px; overflow: hidden; }
  .fc-progress-bar { height: 100%; width: 0; background: linear-gradient(90deg, var(--brand), var(--lime)); border-radius: 999px; transition: width 0.4s ease; }

  .fc-messages {
    height: clamp(380px, 58vh, 540px);
    overflow-y: auto;
    padding: 20px;
    display: flex; flex-direction: column; gap: 14px;
    scroll-behavior: smooth;
  }

  .fc-msg { display: flex; gap: 10px; align-items: flex-end; max-width: 80%; animation: fc-pop 0.3s ease; }
  .fc-msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .fc-avatar {
    width: 32px; height: 32px; flex-shrink: 0; border-radius: 10px;
    display: grid; place-items: center; font-size: 0.95rem;
    background: linear-gradient(135deg, var(--brand), #27c35f);
  }
  .fc-msg.user .fc-avatar { background: #0f1f17; color: #fff; font-size: 0.7rem; font-weight: 700; border-radius: 50%; }
  .fc-bubble {
    padding: 12px 16px; border-radius: 18px;
    font-size: 0.95rem; line-height: 1.55;
    white-space: pre-wrap; word-wrap: break-word;
  }
  .fc-msg.bot .fc-bubble { background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 6px; }
  .fc-msg.user .fc-bubble { background: linear-gradient(135deg, var(--brand), #22b85a); color: #fff; border-bottom-right-radius: 6px; box-shadow: 0 6px 16px -6px rgba(31, 174, 82, 0.5); }
  @keyframes fc-pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  .fc-typing span { display: inline-block; width: 7px; height: 7px; margin: 0 2px; background: var(--brand); border-radius: 50%; animation: fc-blink 1.2s infinite; }
  .fc-typing span:nth-child(2) { animation-delay: 0.2s; }
  .fc-typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes fc-blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }

  /* ============ CHIPS + INPUT ============ */
  .fc-options { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 20px 12px; }
  .fc-options:empty { display: none; }
  .fc-chip {
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    font: 600 0.88rem "Inter", sans-serif;
    padding: 10px 16px; border-radius: 999px; cursor: pointer;
    transition: all 0.15s;
  }
  .fc-chip:hover { border-color: var(--brand); background: var(--brand-soft); color: var(--brand-dark); transform: translateY(-1px); }
  .fc-chip.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  .fc-chip.primary:hover { background: var(--brand-dark); color: #fff; }

  .fc-inputbar { padding: 12px 20px 20px; border-top: 1px solid var(--border); }
  .fc-inputwrap {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 999px; padding: 6px 6px 6px 20px;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .fc-inputwrap:focus-within { border-color: var(--brand); box-shadow: 0 0 0 4px rgba(31, 174, 82, 0.12); }
  .fc-input {
    flex: 1; min-width: 0; border: none; outline: none; background: transparent;
    font: 400 1rem "Inter", sans-serif; color: var(--text); /* 16px stops iOS zoom */
    padding: 10px 0;
  }
  .fc-send {
    width: 44px; height: 44px; flex-shrink: 0; border: none; border-radius: 50%;
    background: var(--brand); color: #fff; cursor: pointer;
    display: grid; place-items: center;
    transition: background 0.2s, transform 0.15s;
  }
  .fc-send:hover { background: var(--brand-dark); transform: scale(1.05); }
  .fc-send:disabled { background: #b9dcc5; cursor: default; transform: none; }
  .fc-send svg { width: 20px; height: 20px; }

  /* ============ TRAINING PLAN ============ */
  .fc-plan { background: var(--card); border: 1px solid var(--border); border-radius: 22px; overflow: hidden; animation: fc-pop 0.4s ease; flex-shrink: 0; }
  .fc-plan-head { padding: 20px; background: linear-gradient(135deg, var(--brand-soft), #f4fbe9); border-bottom: 1px solid var(--border); }
  .fc-plan-head h3 { font-family: var(--heading); font-weight: 800; letter-spacing: -0.02em; font-size: 1.3rem; margin: 0 0 10px; }
  .fc-tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .fc-tag { background: var(--card); border: 1px solid var(--border); color: var(--brand-dark); padding: 4px 12px; border-radius: 999px; font-size: 0.78rem; font-weight: 600; }

  .fc-rotation { margin: 16px 16px 0; padding: 16px; border-radius: 18px; border: 1px solid var(--border); background: linear-gradient(135deg, #ffffff, var(--brand-soft)); }
  .fc-rotation-head h4 { font-family: var(--heading); font-weight: 800; letter-spacing: -0.01em; font-size: 1.05rem; margin: 0 0 4px; }
  .fc-rotation-head p { margin: 0 0 14px; font-size: 0.87rem; color: var(--muted); line-height: 1.5; }
  .fc-rotation-steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
  .fc-rotation-step { display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; padding: 12px 8px; background: var(--card); border: 1px solid var(--border); border-radius: 14px; position: relative; }
  .fc-rotation-step:not(:last-child)::after { content: "→"; position: absolute; left: 100%; width: 20px; top: 50%; transform: translateY(-50%); text-align: center; color: var(--brand); font-weight: 800; font-size: 1rem; }
  .fc-rotation-day { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--brand-dark); }
  .fc-rotation-icon { font-size: 1.4rem; }
  .fc-rotation-name { font-size: 0.82rem; font-weight: 600; line-height: 1.3; }
  .fc-days { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; padding: 16px; }
  .fc-day { border: 1px solid var(--border); border-radius: 16px; padding: 14px; background: var(--card); }
  .fc-day.rest { background: var(--surface); border-style: dashed; }
  .fc-day-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 4px; }
  .fc-day-name { font-family: var(--heading); font-weight: 800; letter-spacing: -0.01em; }
  .fc-day-time { font-size: 0.75rem; color: var(--muted); font-weight: 600; white-space: nowrap; }
  .fc-day-focus { display: inline-block; font-size: 0.75rem; font-weight: 700; color: var(--brand-dark); background: var(--brand-soft); padding: 3px 10px; border-radius: 999px; margin-bottom: 10px; }
  .fc-day.rest .fc-day-focus { color: var(--muted); background: #eef2ef; }
  .fc-day ul { margin: 0; padding: 0; list-style: none; }
  .fc-day li { font-size: 0.87rem; line-height: 1.45; padding: 6px 0; border-top: 1px solid #f0f4f1; }
  .fc-day li:first-child { border-top: none; }
  .fc-day li span { display: block; color: var(--muted); font-size: 0.8rem; }
  .fc-plan-note { margin: 0 16px 16px; padding: 14px 16px; border-radius: 14px; background: var(--surface); border: 1px solid var(--border); font-size: 0.87rem; color: var(--muted); line-height: 1.6; }
  .fc-plan-note strong { color: var(--text); }

  /* ============ PHONES ============ */
  @media (max-width: 640px) {
    .fc-section { padding: 32px 12px; }
    .fc-topbar { padding: 14px; }
    .fc-tabs { width: 100%; }
    .fc-tab { flex: 1; padding: 10px 8px; font-size: 0.85rem; }
    .fc-messages { padding: 14px; height: 62vh; }
    .fc-msg { max-width: 92%; }
    .fc-options, .fc-progress { padding-left: 14px; padding-right: 14px; }
    .fc-inputbar { padding: 10px 14px 14px; }
    .fc-rotation-steps { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .fc-rotation-step::after { display: none; }
  }
</style>
</head>
<body>

<section class="fc-section">
  <div class="fc-intro">
    <span class="fc-eyebrow">⚽ Your Personal AI Football Coach</span>
    <h2>Your coach, <span class="fc-gradient">on demand.</span></h2>
    <p>Answer 5 quick questions for a personalised weekly plan, or ask your coach anything about getting better.</p>
  </div>

  <div class="fc-card">
    <div class="fc-topbar">
      <div class="fc-coach">
        <div class="fc-logo">⚽</div>
        <div>
          <div class="fc-coach-name">Coach AI</div>
          <div class="fc-status">Online · replies instantly</div>
        </div>
      </div>
      <nav class="fc-tabs" role="tablist">
        <button type="button" class="fc-tab active" data-tab="planner">📅 Weekly Training Planner</button>
        <button type="button" class="fc-tab" data-tab="coach">💬 Ask a Coach</button>
      </nav>
    </div>

    <!-- TAB 1: WEEKLY TRAINING PLANNER -->
    <div class="fc-panel active" id="panel-planner">
      <div class="fc-progress">
        <div class="fc-progress-row"><span id="progress-label">Question 1 of 5</span><span id="progress-pct">0%</span></div>
        <div class="fc-progress-track"><div class="fc-progress-bar" id="progress-bar"></div></div>
      </div>
      <div class="fc-messages" id="planner-messages"></div>
      <div class="fc-options" id="planner-options"></div>
      <!-- No <form> on purpose: website builders often show pages in a
           sandboxed frame that blocks form submits, which breaks Send. -->
      <div class="fc-inputbar">
        <div class="fc-inputwrap">
          <input class="fc-input" id="planner-input" type="text" placeholder="Tap an option or type your answer..." autocomplete="off" enterkeyhint="send">
          <button type="button" class="fc-send" id="planner-send" aria-label="Send">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </button>
        </div>
      </div>
    </div>

    <!-- TAB 2: ASK A COACH -->
    <div class="fc-panel" id="panel-coach">
      <div class="fc-messages" id="coach-messages"></div>
      <div class="fc-options" id="coach-suggestions"></div>
      <div class="fc-inputbar">
        <div class="fc-inputwrap">
          <input class="fc-input" id="coach-input" type="text" placeholder="Ask any football question..." autocomplete="off" enterkeyhint="send">
          <button type="button" class="fc-send" id="coach-send" aria-label="Send">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</section>

<script>
/* ==========================================================================
   🔌 AI CONNECTION POINT
   --------------------------------------------------------------------------
   Right now the chatbot uses PRETEND answers (USE_REAL_AI = false).
   To connect a real AI later:
     1. Set USE_REAL_AI = true
     2. Set AI_ENDPOINT to YOUR OWN backend / serverless function URL.
        (Never put a secret API key directly in this file — anyone can see it.)
     3. Your backend should accept:  { system, messages: [{role, content}] }
        and return JSON:              { reply: "text answer" }
   Only the two functions below talk to the "AI", so that's all you change.
   ========================================================================== */
const USE_REAL_AI = false;
const AI_ENDPOINT = "https://your-backend.example.com/api/coach";

async function callAI(systemPrompt, messages) {
  const res = await fetch(AI_ENDPOINT, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ system: systemPrompt, messages })
  });
  if (!res.ok) throw new Error("AI request failed: " + res.status);
  const data = await res.json();
  return data.reply;
}

/** Tab 2: returns the coach's answer to a question. */
async function getCoachReply(question, history) {
  if (USE_REAL_AI) {
    return callAI(
      "You are a friendly, encouraging football (soccer) coach. Give short, practical tips for young players.",
      history
    );
  }
  await wait(700 + Math.random() * 600); // pretend the AI is "thinking"
  return fakeCoachReply(question);
}

/** Tab 1: returns a 7-day plan as an array of { day, focus, rest, rotating, icon, drills: [{name, detail}] }. */
async function getTrainingPlan(profile) {
  if (USE_REAL_AI) {
    const reply = await callAI(
      "You are a football coach. Reply ONLY with a JSON array of 7 objects (Monday to Sunday) " +
      'shaped like {"day":"Monday","focus":"...","rest":false,"drills":[{"name":"...","detail":"..."}]}. ' +
      "Include at least one full rest day and suit the player's age. " +
      'If focusMode is "rotating", give every training day a DIFFERENT main focus and add "rotating":true and an "icon" emoji to those days.',
      [{ role: "user", content: JSON.stringify(profile) }]
    );
    return JSON.parse(reply);
  }
  await wait(1200);
  return fakeTrainingPlan(profile);
}

/* ==========================================================================
   PRETEND DATA (delete or ignore once a real AI is connected)
   ========================================================================== */
const POSITION_DRILLS = {
  Goalkeeper: [
    { name: "Diving saves", detail: "10 each side, low and high" },
    { name: "Reaction ball catches", detail: "3 × 2 min against a wall" },
    { name: "Distribution practice", detail: "15 throws + 15 goal kicks at a target" },
    { name: "1v1 smothering", detail: "Partner runs in, you close down the angle" },
    { name: "Cross claiming", detail: "10 crosses – call 'Keeper!' and catch at the highest point" }
  ],
  Defender: [
    { name: "Jockeying & body shape", detail: "4 × 1 min side-on, staying on your toes" },
    { name: "Heading clearances", detail: "20 headers aiming high and wide" },
    { name: "Recovery sprints", detail: "8 × 30 m turn-and-chase sprints" },
    { name: "Long passing", detail: "20 switches of play to a target 30 m away" },
    { name: "1v1 defending", detail: "Stop a partner getting past you, 6 rounds" }
  ],
  Midfielder: [
    { name: "Scanning & first touch", detail: "Look over shoulder before every receive, 5 min" },
    { name: "Passing triangles", detail: "10 min one-and-two-touch with cones" },
    { name: "Box-to-box runs", detail: "6 × 60 m at 80% pace" },
    { name: "Through-ball practice", detail: "15 passes between two cones into space" },
    { name: "Turning under pressure", detail: "Receive, half-turn, play forward – 20 reps" }
  ],
  Winger: [
    { name: "Cone dribbling at speed", detail: "6 runs through a slalom" },
    { name: "Crossing from the byline", detail: "15 crosses to a target area" },
    { name: "1v1 moves", detail: "Step-overs, scissors & drag-backs – 10 each" },
    { name: "Acceleration sprints", detail: "10 × 15 m explosive starts" },
    { name: "Cut inside & shoot", detail: "12 reps from the wide channel" }
  ],
  Striker: [
    { name: "Finishing drill", detail: "20 shots – aim for the corners" },
    { name: "First-time finishing", detail: "Partner rolls ball in, shoot first time ×15" },
    { name: "Hold-up play", detail: "Receive with back to goal, shield, lay off ×15" },
    { name: "Runs in behind", detail: "Timing runs off the last defender ×10" },
    { name: "Headers on goal", detail: "15 headers aimed downwards" }
  ]
};

// Words a player might type → extra drills that target them.
const FOCUS_LIBRARY = [
  { keys: ["weak foot", "left foot", "right foot", "both feet", "other foot"], drill: { name: "Weak-foot wall passes", detail: "100 touches with your weaker foot only" } },
  { keys: ["speed", "pace", "fast", "slow", "quick", "sprint"], drill: { name: "Speed ladder + sprints", detail: "5 ladder patterns, then 6 × 20 m sprints" } },
  { keys: ["stamina", "fitness", "tired", "endurance", "running"], drill: { name: "Interval running", detail: "8 × (1 min fast, 1 min jog)" } },
  { keys: ["shoot", "shot", "finish", "goal", "scoring"], drill: { name: "Shooting accuracy", detail: "Aim at 4 targets in the goal corners, 20 shots" } },
  { keys: ["pass", "passing"], drill: { name: "Wall passing", detail: "50 passes each foot, two-touch" } },
  { keys: ["dribbl", "skill", "ball control", "close control"], drill: { name: "Tight-space dribbling", detail: "Keep the ball inside a 5 m box for 3 × 2 min" } },
  { keys: ["touch", "first touch", "control"], drill: { name: "First-touch juggling", detail: "Juggle, then trap dead – 10 min" } },
  { keys: ["header", "heading", "aerial", "jump"], drill: { name: "Heading & jumping", detail: "15 jump-headers + 3 × 10 squat jumps" } },
  { keys: ["strength", "strong", "weak", "physical", "muscle"], drill: { name: "Bodyweight strength", detail: "3 × (10 squats, 10 lunges, 20 s plank)" } },
  { keys: ["confidence", "nervous", "mental", "focus"], drill: { name: "Visualisation", detail: "5 min picturing yourself playing your best game" } },
  { keys: ["defend", "tackl", "marking"], drill: { name: "Tackling technique", detail: "Block-tackle practice with a partner, 15 reps" } },
  { keys: ["cross", "crossing"], drill: { name: "Crossing accuracy", detail: "15 crosses into a coned area" } },
  { keys: ["positioning", "vision", "awareness", "decision"], drill: { name: "Scanning game", detail: "Watch 10 min of pro highlights for your position and note positioning" } }
];

function findFocusDrills(text) {
  const lower = (text || "").toLowerCase();
  return FOCUS_LIBRARY.filter(f => f.keys.some(k => lower.includes(k))).map(f => f.drill);
}

// Used when a player has nothing specific to work on: each training day
// picks a different one of these, so the week covers all-round skills.
const ROTATION_FOCUSES = [
  { focus: "Ball Mastery", icon: "⚽", drills: [
    { name: "Toe taps & sole rolls", detail: "3 × 1 min as fast as you can" },
    { name: "Juggling challenge", detail: "Try to beat your record – 10 min" } ] },
  { focus: "Passing & Receiving", icon: "🎯", drills: [
    { name: "Wall passes", detail: "50 with each foot, two-touch" },
    { name: "Receive on the half-turn", detail: "Open your body and play forward – 20 reps" } ] },
  { focus: "Shooting & Finishing", icon: "🥅", drills: [
    { name: "Target shooting", detail: "20 shots aimed at the corners" },
    { name: "Volleys & half-volleys", detail: "10 with each foot" } ] },
  { focus: "Dribbling & 1v1", icon: "🌀", drills: [
    { name: "Cone slalom", detail: "6 runs, using both feet" },
    { name: "1v1 moves", detail: "Step-over, drag-back & scissors – 10 each" } ] },
  { focus: "Speed & Agility", icon: "⚡", drills: [
    { name: "Ladder footwork", detail: "5 different patterns, 3 times each" },
    { name: "Reaction sprints", detail: "8 × 10 m starting on a partner's call" } ] },
  { focus: "Fitness & Stamina", icon: "🔋", drills: [
    { name: "Interval runs", detail: "8 × (1 min fast, 1 min jog)" },
    { name: "Box-to-box shuttles", detail: "6 × 40 m with 30 s rest" } ] },
  { focus: "First Touch", icon: "👟", drills: [
    { name: "Wall control", detail: "Trap with inside, outside, sole & thigh – 10 min" },
    { name: "High-ball control", detail: "Throw it up and cushion it dead – 20 reps" } ] },
  { focus: "Game Intelligence", icon: "🧠", drills: [
    { name: "Scanning drill", detail: "Check your shoulder before every touch – 5 min" },
    { name: "Watch & learn", detail: "10 min of pro clips for your position – note their movement" } ] }
];

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// True when the player's answers don't point at anything specific to train.
function hasSpecificFocus(p) {
  return findFocusDrills(p.weaknesses + " " + p.goal).length > 0;
}

function fakeTrainingPlan(p) {
  const drills = POSITION_DRILLS[p.position] || POSITION_DRILLS.Midfielder;
  if (p.focusMode === "rotating" || !hasSpecificFocus(p)) return rotatingPlan(p, drills);
  const focus = findFocusDrills(p.weaknesses + " " + p.goal);

  const weakFoot = p.foot === "Left" ? "right" : p.foot === "Right" ? "left" : null;
  const footDrill = weakFoot
    ? { name: "Weaker-foot practice", detail: `50 passes and 10 shots with your ${weakFoot} foot` }
    : { name: "Two-footed combos", detail: "Alternate feet on every touch – 5 min" };

  // Younger players get shorter sessions and more fun.
  const minutes = { "Under 10": "30–40 min", "10-13": "45 min", "14-17": "60 min", "18+": "60–75 min" }[p.ageGroup] || "45 min";
  const young = p.ageGroup === "Under 10";
  const warmUp = { name: "Warm-up", detail: young ? "Tag game + dynamic stretches, 8 min" : "Jog, dynamic stretches & rondo, 10 min" };
  const coolDown = { name: "Cool-down", detail: "Light jog + stretching, 5 min" };
  const pick = (arr, i) => arr[i % arr.length];

  return [
    { day: "Monday", focus: `${p.position} skills`, drills: [warmUp, drills[0], drills[1], coolDown] },
    { day: "Tuesday", focus: "Your main goal", drills: [warmUp, pick(focus, 0), pick(focus, 1), footDrill, coolDown] },
    { day: "Wednesday", focus: "Rest & recovery", rest: true, drills: [
      { name: "Full rest", detail: "Let your body recover and grow stronger" },
      { name: "Optional", detail: "Light walk or stretching, drink plenty of water" }
    ] },
    { day: "Thursday", focus: "Weak spots", drills: [warmUp, pick(focus, 1), drills[2], footDrill, coolDown] },
    { day: "Friday", focus: young ? "Fun games" : "Speed & fitness", drills: young
      ? [warmUp, { name: "Small-sided game", detail: "3v3 or 4v4 with friends, 20 min" }, drills[3], coolDown]
      : [warmUp, { name: "Agility circuit", detail: "Cones, ladders & short sprints, 15 min" }, drills[3], coolDown] },
    { day: "Saturday", focus: "Match day / game play", drills: [
      warmUp,
      { name: "Match or scrimmage", detail: "Try to use what you practised this week" },
      drills[4],
      coolDown
    ] },
    { day: "Sunday", focus: "Rest day", rest: true, drills: [
      { name: "Full rest", detail: "Sleep well and eat good food" },
      { name: "Reflect", detail: "Write down one thing you improved this week" }
    ] }
  ].map(d => ({ ...d, minutes: d.rest ? "" : minutes }));
}

// All-round week: every training day gets a different main focus.
function rotatingPlan(p, drills) {
  const minutes = { "Under 10": "30–40 min", "10-13": "45 min", "14-17": "60 min", "18+": "60–75 min" }[p.ageGroup] || "45 min";
  const young = p.ageGroup === "Under 10";
  const warmUp = { name: "Warm-up", detail: young ? "Tag game + dynamic stretches, 8 min" : "Jog, dynamic stretches & rondo, 10 min" };
  const coolDown = { name: "Cool-down", detail: "Light jog + stretching, 5 min" };
  const picks = shuffle(ROTATION_FOCUSES).slice(0, 4);

  const trainingDay = (day, i) => ({
    day, focus: picks[i].focus, icon: picks[i].icon, rotating: true,
    drills: [warmUp, ...picks[i].drills, drills[i], coolDown]
  });

  return [
    trainingDay("Monday", 0),
    trainingDay("Tuesday", 1),
    { day: "Wednesday", focus: "Rest & recovery", rest: true, drills: [
      { name: "Full rest", detail: "Let your body recover and grow stronger" },
      { name: "Optional", detail: "Light walk or stretching, drink plenty of water" }
    ] },
    trainingDay("Thursday", 2),
    trainingDay("Friday", 3),
    { day: "Saturday", focus: "Match day – mix it all", icon: "🏟️", drills: [
      warmUp,
      { name: "Match or scrimmage", detail: "Try to use a skill from every focus day this week" },
      drills[4],
      coolDown
    ] },
    { day: "Sunday", focus: "Rest day", rest: true, drills: [
      { name: "Full rest", detail: "Sleep well and eat good food" },
      { name: "Reflect", detail: "Which focus day felt hardest? That could be next week's goal" }
    ] }
  ].map(d => ({ ...d, minutes: d.rest ? "" : minutes }));
}

const COACH_ANSWERS = [
  { keys: ["weak foot", "left foot", "right foot", "other foot"], reply: "Great question! To improve your weaker foot:\n\n1. Do 100 wall passes with ONLY your weak foot every day.\n2. Juggle using just that foot.\n3. In training games, challenge yourself to use it at least 5 times.\n\nIt feels awkward at first, but after 3–4 weeks you'll notice a big difference! 💪" },
  { keys: ["faster", "speed", "pace", "quick"], reply: "To get faster:\n\n• Short sprints (10–20 m) with full rest between them\n• Ladder drills for quick feet\n• Work on your first 3 steps – that's where games are won\n• Sleep well – your body gets faster while you rest!\n\nTry 2 speed sessions a week. 🏃" },
  { keys: ["shoot", "shot", "finish", "score", "goal"], reply: "Better shooting tips:\n\n1. Plant your non-kicking foot next to the ball, pointing at the target.\n2. Keep your head down and body over the ball to keep it low.\n3. Strike with your laces for power, inside of the foot for accuracy.\n4. Aim for the corners – keepers hate them!\n\nPractise 20 shots, 3 times a week. ⚽" },
  { keys: ["stamina", "fitness", "tired", "run more", "endurance"], reply: "To build stamina:\n\n• Interval runs: 1 min fast, 1 min jog, repeat 8 times\n• Play small-sided games – they're fitness in disguise\n• Drink water and eat carbs (pasta, rice) before training\n\nBuild it up slowly over a few weeks. 🔋" },
  { keys: ["dribbl", "skill", "trick"], reply: "Dribbling tips:\n\n• Keep the ball close – lots of small touches\n• Use both the inside and outside of your feet\n• Look up between touches to see space\n• Learn 2 moves really well (like a step-over and a drag-back) before adding more\n\nSet up cones and dribble through them every day! 🌀" },
  { keys: ["pass", "passing"], reply: "For better passing:\n\n• Use the inside of your foot for short, accurate passes\n• Point your standing foot where you want the ball to go\n• Check your shoulder BEFORE the ball arrives so you know where to pass\n• Pass to your teammate's stronger foot\n\nWall passing is the best way to practise alone. 🎯" },
  { keys: ["first touch", "control", "touch"], reply: "First touch is everything! Try this:\n\n• Kick the ball against a wall and control it with different parts of your foot\n• Cushion the ball – relax your foot as it arrives\n• Take your first touch AWAY from pressure, into space\n\n10 minutes a day will make a huge difference. 👟" },

  { keys: ["header", "heading"], reply: "Heading tips:\n\n• Use your forehead, not the top of your head\n• Keep your eyes open and mouth closed\n• Attack the ball – don't let it hit you\n• Use your arms for balance when you jump\n\nYounger players should practise with a soft/light ball. 🧠" },
  { keys: ["goalkeeper", "keeper", "save", "diving"], reply: "Goalkeeper tips:\n\n• Stay on your toes in the 'ready' position\n• Make your hands into a 'W' shape to catch\n• Narrow the angle by stepping off your line\n• Communicate loudly with your defenders!\n\nPractise diving on soft grass first. 🧤" },
  { keys: ["defend", "tackl", "defender"], reply: "Defending tips:\n\n• Stand side-on so you can turn quickly\n• Stay patient – don't dive in!\n• Watch the ball, not the player's tricks\n• Show the attacker onto their weaker foot or towards the sideline\n\nGood defenders are patient defenders. 🛡️" },
  { keys: ["injur", "hurt", "pain", "sore"], reply: "If something hurts, stop and rest – and tell a parent, coach or doctor, especially if the pain lasts more than a couple of days. For small knocks, rest and ice can help. Always warm up properly to help prevent injuries. 🩹" }
];

function fakeCoachReply(question) {
  const lower = question.toLowerCase();
  if (/^(hi|hello|hey)\b/.test(lower)) {
    return "Hey! 👋 I'm your coach. Ask me anything – shooting, passing, speed, confidence, food… whatever you want to get better at!";
  }
  const match = COACH_ANSWERS.find(a => a.keys.some(k => lower.includes(k)));
  if (match) return match.reply;
  return "Good question! 🤔 Here's my general advice:\n\n• Practise a little every day – 20 minutes beats 2 hours once a week\n• Work on your weaker foot\n• Watch pros who play your position\n• Rest well and have fun!\n\nTry asking me about shooting, passing, speed, stamina, dribbling or confidence for more specific tips.";
}

/* ==========================================================================
   HELPERS
   ========================================================================== */
const wait = ms => new Promise(r => setTimeout(r, ms));

function escapeHTML(str) {
  return String(str).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function scrollToBottom(container) {
  container.scrollTop = container.scrollHeight;
}

function addMessage(container, sender, text) {
  const msg = document.createElement("div");
  msg.className = "fc-msg " + sender;
  msg.innerHTML = `<div class="fc-avatar">${sender === "bot" ? "⚽" : "You"}</div><div class="fc-bubble"></div>`;
  msg.querySelector(".fc-bubble").textContent = text;
  container.appendChild(msg);
  scrollToBottom(container);
  return msg;
}

function showTyping(container) {
  const msg = document.createElement("div");
  msg.className = "fc-msg bot";
  msg.innerHTML = `<div class="fc-avatar">⚽</div><div class="fc-bubble fc-typing"><span></span><span></span><span></span></div>`;
  container.appendChild(msg);
  scrollToBottom(container);
  return () => msg.remove();
}

async function botSay(container, text) {
  const stop = showTyping(container);
  await wait(500);
  stop();
  addMessage(container, "bot", text);
}

// Wires up a Send button + the Enter key. Uses plain click/keydown events
// instead of a <form>, so it still works inside sandboxed website builders.
function onSend(input, button, handler) {
  const send = () => {
    if (button.disabled) return;
    const text = input.value.trim();
    if (!text) { input.focus(); return; }
    input.value = "";
    handler(text);
  };
  button.addEventListener("click", send);
  input.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.isComposing) { e.preventDefault(); send(); }
  });
}

function makeChip(label, onClick, primary) {
  const chip = document.createElement("button");
  chip.type = "button";
  chip.className = "fc-chip" + (primary ? " primary" : "");
  chip.textContent = label;
  chip.addEventListener("click", onClick);
  return chip;
}

/* ==========================================================================
   TABS
   ========================================================================== */
document.querySelectorAll(".fc-tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".fc-tab").forEach(t => t.classList.toggle("active", t === tab));
    document.querySelectorAll(".fc-panel").forEach(p => p.classList.toggle("active", p.id === "panel-" + tab.dataset.tab));
  });
});

/* ==========================================================================
   TAB 1: WEEKLY TRAINING PLANNER
   ========================================================================== */
const QUESTIONS = [
  { key: "position", text: "First up – what position do you play? ⚽", options: ["Goalkeeper", "Defender", "Midfielder", "Winger", "Striker"] },
  { key: "ageGroup", text: "Nice! What is your age group?", options: ["Under 10", "10-13", "14-17", "18+"] },
  { key: "foot", text: "Which is your strong foot? 👟", options: ["Left", "Right", "Both"] },
  { key: "weaknesses", text: "What are your weaknesses? Be honest – that's how we improve! 💪", placeholder: "e.g. my left foot, I get tired quickly...", skipChip: "🤷 Nothing specific" },
  { key: "goal", text: "Last one! What do you want to work on most? 🎯", placeholder: "e.g. scoring more goals, getting faster...", skipChip: "🔄 Mix it up for me" }
];

const plannerMsgs = document.getElementById("planner-messages");
const plannerOptions = document.getElementById("planner-options");
const plannerInput = document.getElementById("planner-input");
const plannerSend = document.getElementById("planner-send");

let step = 0;
let profile = {};
let waitingForAnswer = false;

function updateProgress() {
  const done = Math.min(step, QUESTIONS.length);
  const pct = Math.round((done / QUESTIONS.length) * 100);
  document.getElementById("progress-bar").style.width = pct + "%";
  document.getElementById("progress-pct").textContent = pct + "%";
  document.getElementById("progress-label").textContent =
    done >= QUESTIONS.length ? "All done – plan ready!" : `Question ${done + 1} of ${QUESTIONS.length}`;
}

async function askQuestion() {
  const q = QUESTIONS[step];
  plannerOptions.innerHTML = "";
  waitingForAnswer = false;
  updateProgress();
  await botSay(plannerMsgs, q.text);

  if (q.options) {
    q.options.forEach(opt => plannerOptions.appendChild(makeChip(opt, () => handleAnswer(opt))));
    plannerInput.placeholder = "Tap an option or type your answer...";
  } else {
    plannerInput.placeholder = q.placeholder;
    if (q.skipChip) plannerOptions.appendChild(makeChip(q.skipChip, () => handleAnswer("Nothing specific")));
  }
  waitingForAnswer = true;
  plannerSend.disabled = false;
}

// Turns a typed answer like "striker", "u10" or "12" into one of the options.
function matchOption(text, options) {
  const clean = s => s.toLowerCase().replace(/[^a-z0-9]/g, "");
  const typed = clean(text);
  const found = options.find(o => typed.includes(clean(o)) || (typed.length > 2 && clean(o).includes(typed)));
  if (found) return found;
  if (options.includes("Under 10")) { // age group: accept a plain age
    const age = parseInt(text.replace(/\D/g, ""), 10);
    if (!isNaN(age)) return age < 10 ? "Under 10" : age <= 13 ? "10-13" : age <= 17 ? "14-17" : "18+";
  }
  return null;
}

function handleAnswer(answer) {
  if (!waitingForAnswer) return; // ignore clicks while the coach is "typing"
  const q = QUESTIONS[step];
  if (q.options) {
    const match = matchOption(answer, q.options);
    if (!match) {
      addMessage(plannerMsgs, "user", answer);
      addMessage(plannerMsgs, "bot", "Hmm, I didn't catch that. Please choose one of: " + q.options.join(", "));
      return;
    }
    answer = match;
  }
  waitingForAnswer = false;
  addMessage(plannerMsgs, "user", answer);
  profile[q.key] = answer;
  plannerOptions.innerHTML = "";
  step++;
  if (step < QUESTIONS.length) askQuestion();
  else buildPlan();
}

onSend(plannerInput, plannerSend, text => {
  if (waitingForAnswer) {
    handleAnswer(text);
  } else if (step >= QUESTIONS.length) {
    addMessage(plannerMsgs, "user", text);
    addMessage(plannerMsgs, "bot", "Your plan is ready above! 👆 Tap \"Make a new plan\" to start again, or switch to \"Ask a Coach\" for questions.");
  }
});

async function buildPlan() {
  updateProgress();
  plannerInput.placeholder = "Your plan is ready!";
  profile.focusMode = hasSpecificFocus(profile) ? "targeted" : "rotating";
  await botSay(plannerMsgs, profile.focusMode === "rotating"
    ? "No problem! I'll build you an all-round week where every training day has a different main focus. 🔄"
    : "Brilliant! Give me a second to build your personal 7-day plan... 📝");
  const stop = showTyping(plannerMsgs);
  let plan;
  try {
    plan = await getTrainingPlan(profile);
  } catch (err) {
    stop();
    addMessage(plannerMsgs, "bot", "Sorry, something went wrong making your plan. Please try again!");
    showRestart();
    return;
  }
  stop();
  renderPlan(plan);
  showRestart();
}

// Rotating plans only: pick a fresh set of focus days with the same answers.
let shuffling = false;
async function shufflePlan() {
  if (shuffling) return;
  shuffling = true;
  addMessage(plannerMsgs, "user", "🔀 Shuffle my focus days");
  const stop = showTyping(plannerMsgs);
  try {
    const plan = await getTrainingPlan(profile);
    stop();
    renderPlan(plan);
  } catch (err) {
    stop();
    addMessage(plannerMsgs, "bot", "Sorry, I couldn't shuffle your plan. Please try again!");
  }
  shuffling = false;
}

function renderPlan(plan) {
  const wrap = document.createElement("div");
  wrap.className = "fc-plan";
  const tags = [profile.position, profile.ageGroup, profile.foot + " foot"].map(t => `<span class="fc-tag">${escapeHTML(t)}</span>`).join("");
  const rotationDays = plan.filter(d => d.rotating);
  const rotationSection = rotationDays.length ? `
    <div class="fc-rotation">
      <div class="fc-rotation-head">
        <h4>🔄 Rotating Focus Week</h4>
        <p>You didn't pick one thing to work on, so each training day switches to a different main focus. That way you improve all-round.</p>
      </div>
      <div class="fc-rotation-steps">
        ${rotationDays.map(d => `
          <div class="fc-rotation-step">
            <span class="fc-rotation-day">${escapeHTML(d.day.slice(0, 3))}</span>
            <span class="fc-rotation-icon">${escapeHTML(d.icon || "⚽")}</span>
            <span class="fc-rotation-name">${escapeHTML(d.focus)}</span>
          </div>`).join("")}
      </div>
    </div>` : "";
  const note = rotationDays.length
    ? `🔄 Mode: <strong>All-round – main focus changes every training day</strong><br>`
    : `🎯 Main goal: <strong>${escapeHTML(profile.goal)}</strong><br>
      💪 Working on: <strong>${escapeHTML(profile.weaknesses)}</strong><br>`;

  wrap.innerHTML = `
    <div class="fc-plan-head">
      <h3>🏆 Your 7-Day Training Plan</h3>
      <div class="fc-tags">${tags}</div>
    </div>
    ${rotationSection}
    <div class="fc-days">
      ${plan.map(d => `
        <div class="fc-day ${d.rest ? "rest" : ""}">
          <div class="fc-day-top">
            <span class="fc-day-name">${escapeHTML(d.day)}</span>
            <span class="fc-day-time">${d.rest ? "😴 Rest" : "⏱ " + escapeHTML(d.minutes || "")}</span>
          </div>
          <span class="fc-day-focus">${d.icon ? escapeHTML(d.icon) + " " : ""}${escapeHTML(d.focus)}</span>
          <ul>
            ${d.drills.map(dr => `<li><strong>${escapeHTML(dr.name)}</strong><span>${escapeHTML(dr.detail)}</span></li>`).join("")}
          </ul>
        </div>`).join("")}
    </div>
    <div class="fc-plan-note">
      ${note}
      Always warm up, drink water and stop if anything hurts.
    </div>`;
  plannerMsgs.appendChild(wrap);
  plannerMsgs.scrollTop = wrap.offsetTop - plannerMsgs.offsetTop - 12;
}

function showRestart() {
  plannerOptions.innerHTML = "";
  plannerOptions.appendChild(makeChip("🔄 Make a new plan", startPlanner, true));
  if (profile.focusMode === "rotating") plannerOptions.appendChild(makeChip("🔀 Shuffle focus days", shufflePlan));
}

async function startPlanner() {
  step = 0;
  profile = {};
  waitingForAnswer = false;
  plannerMsgs.innerHTML = "";
  plannerOptions.innerHTML = "";
  updateProgress();
  await botSay(plannerMsgs, "Hi! 👋 I'm your football coach. Answer 5 quick questions and I'll make you a training plan for the whole week!");
  askQuestion();
}

/* ==========================================================================
   TAB 2: ASK A COACH
   ========================================================================== */
const coachMsgs = document.getElementById("coach-messages");
const coachInput = document.getElementById("coach-input");
const coachSend = document.getElementById("coach-send");
const coachSuggestions = document.getElementById("coach-suggestions");
const coachHistory = []; // [{ role: "user" | "assistant", content }] – ready to send to a real AI

async function askCoach(question) {
  coachSuggestions.innerHTML = "";
  addMessage(coachMsgs, "user", question);
  coachHistory.push({ role: "user", content: question });
  coachSend.disabled = true;

  const stop = showTyping(coachMsgs);
  let reply;
  try {
    reply = await getCoachReply(question, coachHistory);
  } catch (err) {
    reply = "Sorry, I couldn't answer that right now. Please try again in a moment!";
  }
  stop();
  addMessage(coachMsgs, "bot", reply);
  coachHistory.push({ role: "assistant", content: reply });
  coachSend.disabled = false;
}

onSend(coachInput, coachSend, askCoach);

addMessage(coachMsgs, "bot", "Hey! 👋 Ask me anything about getting better at football – shooting, passing, speed, fitness, confidence and more.");
["How do I get faster?", "How can I shoot better?", "How do I improve my weak foot?", "What should I eat before a game?"]
  .forEach(q => coachSuggestions.appendChild(makeChip(q, () => askCoach(q))));

/* START */
startPlanner();
</script>
